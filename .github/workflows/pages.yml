# Publica el dashboard (carpeta web/) y el reel en GitHub Pages cada vez que cambian en main.
name: Publicar el dashboard

on:
  push:
    branches: [main]
    paths: ["web/**", "reel/reel.mp4", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # El reel se copia al sitio para verlo en el navegador sin descargarlo (no se duplica en el repositorio)
      - name: Añadir el reel al sitio
        run: cp reel/reel.mp4 web/reel.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: despliegue
        uses: actions/deploy-pages@v4
